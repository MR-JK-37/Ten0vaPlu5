name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  identity-check:
    name: Commit identity (no AI attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: No AI co-author / attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          RANGE="${BASE_SHA:-HEAD~1}..$HEAD_SHA"
          git log "$RANGE" --format='%H%n%B' > /tmp/msgs.txt || true
          if grep -qiE 'co-authored-by:.*(claude|anthropic)|claude-session|generated with.*(claude|anthropic)|noreply@anthropic\.com|claude\.ai|🤖' /tmp/msgs.txt; then
            echo "A commit in this range contains AI attribution. This repo's policy is zero AI attribution." >&2
            exit 1
          fi
      - name: No non-owner author/committer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OWNER_EMAIL: 231611281+MR-JK-37@users.noreply.github.com
        run: |
          set -euo pipefail
          git log "${BASE_SHA:-HEAD~1}..$HEAD_SHA" --format='%ae%n%ce' | sort -u > /tmp/identities.txt || true
          cat /tmp/identities.txt
          other=$(grep -v -x -e "$OWNER_EMAIL" -e 'noreply@github.com' /tmp/identities.txt || true)
          if [ -n "$other" ]; then
            echo "A commit in this range has an author/committer email other than the repo owner's:" >&2
            echo "$other" >&2
            exit 1
          fi

  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build (dummy env so build doesn't need live secrets)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle-check:
    name: No service-role key in client bundle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      - name: grep client bundle for the service-role string
        run: |
          set -euo pipefail
          if grep -r "SUPABASE_SERVICE_ROLE_KEY" .next/static 2>/dev/null; then
            echo "service-role key reference leaked into the client bundle" >&2
            exit 1
          fi
          echo "clean"
